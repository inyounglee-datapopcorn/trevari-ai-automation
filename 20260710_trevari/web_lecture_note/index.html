<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 일에 바로 써먹는 AI 자동화 — 트레바리</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <link rel="stylesheet" href="sidebar.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main">
        <div class="cohort-bar">
          <label for="cohort-select">기수</label>
          <select id="cohort-select" onchange="switchCohort(this.value)"></select>
        </div>
        <div class="chapter-tag" id="cohort-tag">트레바리 독서모임</div>
        <h1>내 일에 바로 써먹는 AI 자동화</h1>
        <p class="lead"><span id="cohort-lead"></span><br><br><span id="stats-container" style="display:inline-flex; flex-wrap: wrap; align-items:center; gap:6px; padding: 6px 12px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px; font-size: 14.5px; font-weight: 700; color: var(--text);"></span></p>

        <figure id="cohort-photo" class="cohort-photo"></figure>
        <div id="cohort-format"></div>

        <div class="keyword-cloud-container" id="kw-container">
          <div class="kw-header">☁️ 1회차 독후감 핫 키워드</div>
          <div class="kw-cloud" id="kw-cloud"></div>
        </div>

        <hr />

        <style>
          .curriculum-modules { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin: 14px 0 22px; }
          .module-card { padding: 18px 20px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-sm); }
          .module-head { display: flex; flex-direction: column; gap: 6px; }
          .module-head h4 { margin: 0; font-size: 16px; }
          .module-badge { align-self: flex-start; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--border); color: var(--accent-strong); }
          .module-ba { font-size: 14px; color: var(--text-soft); margin: 10px 0 0; line-height: 1.6; }
          .module-chapters { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; }
          @media (max-width: 780px) { .curriculum-modules { grid-template-columns: 1fr; } }
          .cohort-bar { display:flex; align-items:center; gap:10px; margin: 0 0 14px; }
          .cohort-bar label { font-size: 13px; font-weight: 800; color: var(--text-muted); }
          .cohort-bar select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elev); font-family: Pretendard, sans-serif; font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; }
          .cohort-photo { margin: 18px 0 22px; }
          .cohort-photo img { width: 100%; border-radius: 14px; border: 1px solid var(--border); display: block; }
          .cohort-photo figcaption { font-size: 12.5px; color: var(--text-muted); margin-top: 8px; text-align: center; }
          .format-box { padding: 16px 20px; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; margin: 0 0 20px; }
          .format-box ul { margin: 0; padding-left: 18px; line-height: 1.8; font-size: 14.5px; }
          .module-read { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
          .pf-link { font-size: 13.5px; font-weight: 700; color: var(--accent-strong); text-decoration: none; }
          .pf-section-lead { font-size: 16px; color: var(--text-soft); margin: 0 0 18px; }
          .pf-label { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin: 26px 0 12px; }
          .pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; margin: 0 0 8px; }
          .pf-card { display: flex; flex-direction: column; gap: 8px; padding: 20px 22px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-sm); text-decoration: none; color: inherit; transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s; }
          .pf-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-3px); }
          .pf-name { font-size: 16px; font-weight: 800; color: var(--text); margin-top: 2px; }
          .pf-desc { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; flex: 1; }
          @media (max-width: 780px) { .pf-grid { grid-template-columns: 1fr; } }
        </style>



        <h3>시즌 목표</h3>
        <p class="pf-section-lead">시즌이 끝날 즈음, 우리 손에 남는 것들입니다.</p>
        <div class="pf-grid" id="goals-grid"></div>

        <div id="benefits-wrap"></div>

        <h3>4개월의 여정</h3>
        <p>무엇을 다루고 어떻게 발전시킬 것인지, 한 달에 한 번씩 함께 고민하고 만들어 갑니다.</p>
        <div class="curriculum-modules" id="curriculum"></div>

        <div id="notice-wrap"></div>
        <div id="cta-wrap"></div>
      </main>
    </div>
    <script src="cohorts.js"></script>
    <script src="sidebar.js" defer></script>
    <script>
      const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
      function switchCohort(id) {
        try { localStorage.setItem('trevari_cohort', id); } catch (e) {}
        const u = new URL(location.href); u.searchParams.set('c', id); history.replaceState(null, '', u);
        loadCohort(id);
      }
      function renderCohortContent(id) {
        const c = window.COHORTS[id];
        document.getElementById('cohort-tag').textContent = c.tag;
        document.getElementById('cohort-lead').innerHTML = c.lead;
        const ph = document.getElementById('cohort-photo');
        ph.innerHTML = c.photo ? `<img src="${c.photo.src}" alt="트레바리 단체사진 (얼굴 가림)" loading="lazy"><figcaption>${esc(c.photo.caption)}</figcaption>` : '';
        document.getElementById('cohort-format').innerHTML = c.format ? `<div class="format-box"><ul>${c.format.map(f => `<li>${esc(f)}</li>`).join('')}</ul>${c.trevariUrl ? `<a class="pf-link" style="display:inline-block; margin-top:10px;" href="${c.trevariUrl}" target="_blank" rel="noopener">트레바리 클럽 페이지 (독후감 제출·모임 정보) →</a>` : ''}</div>` : '';
        const kw = document.getElementById('kw-container');
        kw.style.display = c.keywords ? '' : 'none';
        document.getElementById('kw-cloud').innerHTML = (c.keywords || []).map(([w, s]) => `<span class="kw kw-${s}">${esc(w)}</span>`).join('');
        document.getElementById('goals-grid').innerHTML = c.goals.map(([n, d]) => `<div class="pf-card"><div class="pf-name">${esc(n)}</div><div class="pf-desc">${esc(d)}</div></div>`).join('');
        document.getElementById('benefits-wrap').innerHTML = c.benefits ? `<h3>멤버 혜택</h3><div class="pf-grid">${c.benefits.map(([n, d, url, lbl]) => `<div class="pf-card"><div class="pf-name">${esc(n)}</div><div class="pf-desc">${esc(d)}</div>${url ? `<a class="pf-link" href="${url}" target="_blank" rel="noopener">${esc(lbl)}</a>` : ''}</div>`).join('')}</div>` : '';
        document.getElementById('curriculum').innerHTML = c.modules.map(m => `<div class="module-card"><div class="module-head"><span class="module-badge">${esc(m.badge)}</span><h4>${esc(m.title)}</h4></div><p class="module-ba">${esc(m.desc)}</p>${m.read ? `<div class="module-read">📖 읽을거리: ${m.readUrl ? `<a href="${m.readUrl}" target="_blank" rel="noopener">${esc(m.read)}</a>` : esc(m.read)}</div>` : ''}${m.link ? `<ul class="module-chapters"><li><a href="${m.link[0]}">${esc(m.link[1])}</a></li></ul>` : '<ul class="module-chapters"><li style="color: var(--text-muted);">교안은 모임 전에 열려요</li></ul>'}</div>`).join('');
        document.getElementById('notice-wrap').innerHTML = c.notice ? `<blockquote class="cl-important"><p>${c.notice}</p></blockquote>` : '';
        document.getElementById('cta-wrap').innerHTML = c.cta ? `<div class="next-cta"><div><div class="label">${esc(c.cta[0])}</div><div class="title">${esc(c.cta[1])}</div></div><a href="${c.cta[2]}">바로 가기 →</a></div>` : '';
      }
      function loadCohort(id) {
        const c = window.COHORTS[id];
        renderCohortContent(id);
        const sel = document.getElementById('cohort-select');
        if (sel.value !== id) sel.value = id;
        fetch(`data/${id}.json`)
          .then(response => response.json())
          .then(data => {
            window.clubMembers = data.members;
            window.clubData = data;
            const statsContainer = document.getElementById('stats-container');
            if (c.statsText) {
              statsContainer.innerHTML = c.statsText;
            } else {
              const totalMembers = data.members.length;
              const first = data.sessions[0].id;
              const submittedCount = data.reviews && data.reviews[first] ? Object.keys(data.reviews[first]).length : 0;
              const rate = totalMembers ? Math.round((submittedCount / totalMembers) * 100) : 0;
              statsContainer.innerHTML = `🙋‍♂️ 참여 인원: 총 ${totalMembers}명 <span style="margin-left: 8px; padding: 4px 10px; border-radius: 6px; background: var(--accent-strong); color: white; font-size: 13.5px; box-shadow: var(--shadow-sm);">📝 1회차 독후감 제출율: ${rate}% (${submittedCount}/${totalMembers}명)</span>`;
            }

          })
          .catch(error => {
            console.error('Error loading data:', error);
          });
      }
      document.addEventListener('DOMContentLoaded', () => {
        const sel = document.getElementById('cohort-select');
        sel.innerHTML = Object.keys(window.COHORTS).sort().reverse().map(k => `<option value="${k}">${esc(window.COHORTS[k].label)}</option>`).join('');
        loadCohort(window.getCohortId());
      });

    </script>
  


</body>
</html>
